<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <filter id="g">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="8" fill="#020611"/>
  <!-- neon hexagon -->
  <polygon
    points="16,4 26,10 26,22 16,28 6,22 6,10"
    fill="none"
    stroke="#38f8ff"
    stroke-width="2.2"
    filter="url(#g)"
  />
  <!-- inner accent dot -->
  <circle cx="16" cy="16" r="3.5" fill="#45ff93" filter="url(#g)"/>
</svg>
